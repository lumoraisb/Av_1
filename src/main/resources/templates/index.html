<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidatos - Eleições 2026</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
    <body>
        <header>
            <h1>Candidatos - Eleições 2026</h1>
        </header>
        <form method="get" th:action="@{/}" class="filtros">
            <label for="texto">Buscar candidato</label>
            <input id="texto" type="text" name="texto" th:value="${textoSelecionado}" placeholder="Nome ou número">
            <select name="cargo">
                <option value="" th:selected="${cargoSelecionado == ''}">Todos os cargos</option>
                <option th:each="c : ${cargos}"
                th:value="${c}"
                th:text="${c}"
                th:selected="${c == cargoSelecionado}"></option>
            </select>
            <select name="partido">
                <option value="" th:selected="${partidoSelecionado == ''}">Todos os partidos</option>
                <option th:each="p : ${partidos}"
                    th:value="${p}"
                    th:text="${p}"
                    th:selected="${p == partidoSelecionado}"></option>
            </select>

            <button type="submit">Filtrar</button>
            <a th:href="@{/}" class="limpar">Limpar</a>
        </form>
        <main>
            <p th:text="${#lists.size(candidatos) + ' candidato(s) encontrado(s)'}"></p>
            <div class="cards-grid">
                <article class="card" th:each="cand : ${candidatos}">
                    <div class="foto-wrapper">
                        <img th:src="@{/images/candidatos/{arquivo}(arquivo=${cand.nomeArquivoFoto})}"
                            th:alt="${cand.nomeUrna}" class="foto-candidato"
                            loading="lazy"
                            onerror="this.onerror=null;this.src='/images/candidatos/sem-foto.jpg';">
                    </div>
                    <div class="card-content">
                        <h2 th:text="${cand.nomeUrna}">Nome de urna</h2>
                        <p class="nome-completo" th:text="${cand.nomeCandidato}">Nome completo</p>
                        <p th:text="${cand.cargo + ' - ' + cand.siglaPartido}">Cargo - Partido</p>
                        <p th:text="${'Número: ' + cand.nrCandidato}">Número</p>
                        <p class="situacao" th:text="${cand.situacaoCandidatura}">Situação</p>
                        <p class="extra" th:if="${cand.idade > 0}"
                            th:text="${cand.idade + ' anos'}">Idade</p>
                    </div>
                </article>
            </div>
            <p class="sem-resultados" th:if="${#lists.isEmpty(candidatos)}">
                Nenhum candidato encontrado com esses filtros.
            </p>
        </main>
    </body>
</html>
